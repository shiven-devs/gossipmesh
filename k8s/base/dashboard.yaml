# The dashboard: a Deployment, not a StatefulSet.
#
# The contrast with the gossip nodes is the lesson. The dashboard has no
# identity worth keeping: nobody addresses it, nothing is seeded from it, and
# replacing it with a differently named pod changes nothing. That is exactly
# when a Deployment is the right choice - and it is why the nodes are not one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: gossip
  labels:
    app.kubernetes.io/name: gossipmesh
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gossipmesh
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gossipmesh
        app.kubernetes.io/component: dashboard
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: dashboard
          image: gossipmesh-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "8080"
            # Resolve the headless Service every sweep, so `kubectl scale` from
            # 5 to 10 appears on the page without redeploying anything. No RBAC
            # and no Kubernetes API access is needed for this: DNS is enough,
            # and asking for API permissions we do not need would be worse.
            - name: NODE_DNS
              value: gossip-headless.$(NAMESPACE).svc.cluster.local
            - name: NODE_PORT
              value: "3000"
            - name: POLL_INTERVAL_MS
              value: "1000"
            - name: REQUEST_TIMEOUT_MS
              value: "700"
            - name: LOG_LEVEL
              value: info
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# A normal ClusterIP Service this time: there is one dashboard and nobody needs
# to address a specific replica, so a virtual IP with load balancing is exactly
# right. Reached from a laptop with:
#   kubectl -n gossip port-forward svc/dashboard 8088:80
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: gossip
  labels:
    app.kubernetes.io/name: gossipmesh
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gossipmesh
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
